name: Bug Report
description: Report something that is not working correctly.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: Version / Branch
      description: Which version or branch are you running?
      placeholder: "e.g. main, v0.1.0"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Docker (docker compose up)
        - Local (go run)
        - Production
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps needed to reproduce the behavior.
      placeholder: |
        1. Send `POST /api/v2/auth/login` with ...
        2. Observe response ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages or logs.
    validations:
      required: true

  - type: input
    id: go_version
    attributes:
      label: Go version
      placeholder: "e.g. go1.26.0"

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context, screenshots, or configuration relevant to the bug.
