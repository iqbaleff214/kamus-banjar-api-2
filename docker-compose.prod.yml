services:
  api:
    build:
      context: .
      target: prod
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - traefik_public
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"

      # ── Router ───────────────────────────────────────────────────────────────
      - "traefik.http.routers.kamus-banjar-api.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.kamus-banjar-api.entrypoints=websecure"
      - "traefik.http.routers.kamus-banjar-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kamus-banjar-api.middlewares=security-headers@docker"

      # ── Service (internal port) ───────────────────────────────────────────────
      - "traefik.http.services.kamus-banjar-api.loadbalancer.server.port=3000"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASS}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - internal

volumes:
  postgres-data:
  redis-data:

networks:
  traefik_public:
    external: true
  internal:
    internal: true
