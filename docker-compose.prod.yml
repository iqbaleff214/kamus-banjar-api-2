services:
  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://${DB_USER}:${DB_PASS}@db:${DB_PORT:-5432}/${DB_NAME}?sslmode=disable"
      - "up"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - internal

  api:
    build:
      context: .
      target: prod
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    networks:
      - traefik_public
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"

      # ── Router ───────────────────────────────────────────────────────────────
      - "traefik.http.routers.kamus-banjar-api.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.kamus-banjar-api.entrypoints=websecure"
      - "traefik.http.routers.kamus-banjar-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.kamus-banjar-api.middlewares=security-headers@docker"

      # ── Service (internal port) ───────────────────────────────────────────────
      - "traefik.http.services.kamus-banjar-api.loadbalancer.server.port=3000"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: >
      sh -c '
        if [ -n "$$REDIS_PASS" ]; then
          redis-server --requirepass "$$REDIS_PASS"
        else
          redis-server
        fi
      '
    environment:
      REDIS_PASS: ${REDIS_PASS:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASS}\" ping 2>/dev/null | grep -q PONG || redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - internal

volumes:
  postgres-data:
  redis-data:

networks:
  traefik_public:
    external: true
  internal:
    internal: true
