version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/identity/infrastructure/postgres/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "sqlcidentity"
        out: "internal/identity/infrastructure/postgres/sqlc"
        emit_json_tags: true
        emit_db_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true

